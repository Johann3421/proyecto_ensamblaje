version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: qc_kenya_postgres_15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-KenyaQC2026Secure!}
      POSTGRES_DB: ${POSTGRES_DB:-qc_kenya_db}
    ports:
      - "${POSTGRES_PORT:-5415}:5432"
    volumes:
      - postgres_data_15:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qc_admin} -d ${POSTGRES_DB:-qc_kenya_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - qc_network_15

  # Aplicación QC KENYA (Frontend React Compilado + Backend FastAPI)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc_kenya_app_15
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qc_admin}:${POSTGRES_PASSWORD:-KenyaQC2026Secure!}@postgres:5432/${POSTGRES_DB:-qc_kenya_db}
      PORT: 8000
      DOMAIN: ${DOMAIN:-ensamblaje.sekaitech.com.pe}
    ports:
      - "${PORT:-3015}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads_15:/app/uploads
    networks:
      - qc_network_15

volumes:
  postgres_data_15:
  app_uploads_15:

networks:
  qc_network_15:
    driver: bridge
